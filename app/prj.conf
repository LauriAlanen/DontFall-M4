# printk goes to the RAM console, which the OpenAMP resource table exposes
# to Linux as remoteproc trace0:
#   cat /sys/kernel/debug/remoteproc/remoteproc0/trace0
CONFIG_PRINTK=y
CONFIG_RAM_CONSOLE=y
CONFIG_UART_CONSOLE=n

CONFIG_IPM=y
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_MASTER=n

# LD7 (PH7) blinky
CONFIG_GPIO=y

# IMU on SPI5 (src/imu.c)
CONFIG_SPI=y

# micro-ROS (src/uros.c). Its allocations go through malloc, whose arena
# is all RAM left over after the static data. Entity limits are compiled
# into libmicroros; raise them as the node grows.
CONFIG_MICROROS=y
CONFIG_MICROROS_TRANSPORT_CUSTOM=y
CONFIG_MICROROS_NODES="1"
CONFIG_MICROROS_PUBLISHERS="1"
CONFIG_MICROROS_SUBSCRIBERS="0"
CONFIG_MICROROS_CLIENTS="0"
CONFIG_MICROROS_SERVERS="0"
# clock_gettime() for rcutils and the XRCE-DDS client
CONFIG_POSIX_TIMERS=y
# rx byte pipe of the micro-ROS transport
CONFIG_PIPES=y
# libmicroros has static constructors (.init_array)
CONFIG_STATIC_INIT_GNU=y
