# printk goes to the RAM console, which the OpenAMP resource table exposes
# to Linux as remoteproc trace0:
#   cat /sys/kernel/debug/remoteproc/remoteproc0/trace0
CONFIG_PRINTK=y
CONFIG_RAM_CONSOLE=y
# 8 KB (default 1 KB, ~3 s of the IMU summary) so a bench test can be
# read back; RAM has room
CONFIG_RAM_CONSOLE_BUFFER_SIZE=8192
CONFIG_UART_CONSOLE=n
# no UART in use (overlay disables the board's USART3/UART7)
CONFIG_SERIAL=n
# the board defconfig sets this; without SERIAL it only warns
CONFIG_UART_INTERRUPT_DRIVEN=n

CONFIG_IPM=y
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_MASTER=n

# LD7 (PH7) blinky
CONFIG_GPIO=y

# IMU on SPI5 (src/imu.c), Zephyr's LSM6DSO driver (needs hal_st)
CONFIG_SPI=y
CONFIG_SENSOR=y
# data-ready interrupt, handled in the driver's own (coop) thread
CONFIG_LSM6DSO_TRIGGER_OWN_THREAD=y

# Tilt filter (src/tilt.c) in float on the M4's single-precision FPU.
# Soft ABI: float arguments still go in integer registers, so objects
# built without the FPU (libmicroros) link unchanged. Sharing: any thread
# may use the FPU registers, the kernel saves them on context switch.
CONFIG_FPU=y
CONFIG_FP_SOFTABI=y
CONFIG_FPU_SHARING=y
# CONFIG_FPU turns float printf on by default (~10 KB of code); nothing
# prints floats (imu.c prints fixed point).
CONFIG_CBPRINTF_FP_SUPPORT=n

# micro-ROS (src/uros.c). Its allocations go through malloc, whose arena
# is all RAM left over after the static data. Entity limits are compiled
# into libmicroros; raise them as the node grows.
CONFIG_MICROROS=y
CONFIG_MICROROS_TRANSPORT_CUSTOM=y
CONFIG_MICROROS_NODES="1"
CONFIG_MICROROS_PUBLISHERS="1"
CONFIG_MICROROS_SUBSCRIBERS="0"
CONFIG_MICROROS_CLIENTS="0"
CONFIG_MICROROS_SERVERS="0"
# clock_gettime() for rcutils and the XRCE-DDS client
CONFIG_POSIX_TIMERS=y
# rx byte pipe of the micro-ROS transport
CONFIG_PIPES=y
# libmicroros has static constructors (.init_array)
CONFIG_STATIC_INIT_GNU=y
