# Sources of libmicroros, imported by west.yml.
#
# micro_ros_zephyr_module's libmicroros.mk used to git clone these at their
# branch heads during every clean build. They are pinned here instead (the
# revisions verified on the board in ROS plan step 4) and our module patch
# builds them from modules/lib/micro_ros/{dev,src}. The DontFall Yocto
# recipe (dontfall-m4.bb) must fetch the same revisions.
#
# To bump: change the revisions (the comment is the branch they track), run
# west update, then delete the build output the module keeps in its source
# tree (modules/lib/micro_ros_zephyr_module/modules/libmicroros/:
# micro_ros_dev/ micro_ros_src/ include/ libmicroros.a) - west build -p
# does not.
manifest:
  remotes:
    - name: ament
      url-base: https://github.com/ament
    - name: ros2
      url-base: https://github.com/ros2
    - name: micro-ROS
      url-base: https://github.com/micro-ROS
    - name: eProsima
      url-base: https://github.com/eProsima

  projects:
    # ament build tools (micro_ros_dev), built for the host
    - name: ament_cmake
      remote: ament
      revision: 358b03b9a78bfca74c3989d983fa928da8170721  # jazzy
      path: modules/lib/micro_ros/dev/ament_cmake
    - name: ament_lint
