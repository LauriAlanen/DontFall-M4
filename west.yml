# West manifest for the DontFall M4 (Cortex-M4, Zephyr) firmware.
#
# Zephyr and its modules are pinned to EXACTLY what meta-zephyr (scarthgap)
# builds in the DontFall Yocto image, so dev (west) and release (bitbake)
# compile the same sources. Bump together with meta-zephyr in
# DontFall/default.xml; scripts/check-zephyr-pin.sh verifies they match.
#
# micro_ros_zephyr_module is not part of meta-zephyr; it is pinned here on
# its own (jazzy branch). It is not a Zephyr module at its root, so
# app/CMakeLists.txt adds its modules/libmicroros dir via
# ZEPHYR_EXTRA_MODULES. The sources it builds libmicroros from are pinned
# in micro_ros.yml.
manifest:
  self:
    path: DontFall-M4
    import: micro_ros.yml

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: micro-ros
      url-base: https://github.com/micro-ROS

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: 36940db938a8f4a1e919496793ed439850a221c2
      import:
        name-allowlist:
          - cmsis
          - hal_stm32
          - libmetal
          - open-amp
    - name: micro_ros_zephyr_module
      remote: micro-ros
      revision: 87dbe3a9b9d0fa347772e971d58d123e2296281a  # jazzy
      path: modules/lib/micro_ros_zephyr_module
